# Full-stack production stack — used for local prod testing or Coolify self-test.
# Usage: docker compose -f docker-compose.prod.yml up --build
# Requires .env with SESSION_SECRET and OPENAI_API_KEY set.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chatbot:chatbot@db:5432/chatbot
      SESSION_SECRET: ${SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    # db:push is idempotent — safe to run on every start
    command: sh -c "npm run db:push && node dist/index.cjs"

volumes:
  pgdata:
