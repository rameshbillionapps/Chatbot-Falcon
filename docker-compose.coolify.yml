# Coolify deployment — app + DB on the same internal Docker network.
#
# Only 2 env vars needed in Coolify's Environment tab (both Runtime):
#
#   SESSION_SECRET  = <run: openssl rand -hex 32>
#   OPENAI_API_KEY  = sk-...
#
# DB credentials are internal-only (not exposed outside Docker network).
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chatbot:chatbot@db:5432/chatbot
      SESSION_SECRET: ${SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: production
      PORT: 5000
    command: sh -c "npm run db:push && node dist/index.cjs"

volumes:
  pgdata:
