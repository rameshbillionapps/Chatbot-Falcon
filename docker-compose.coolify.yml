# Coolify deployment — defines both app and DB on the same internal network.
# Set these env vars in Coolify's Environment tab:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   SESSION_SECRET, OPENAI_API_KEY
#
# DATABASE_URL is NOT needed as an env var — it's built from the above vars internally.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connects to the db service internally — no external URL needed
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    command: sh -c "npm run db:push && node dist/index.cjs"

volumes:
  pgdata:
