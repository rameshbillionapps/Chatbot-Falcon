# Coolify deployment — app + DB on the same internal Docker network.
#
# Required env vars in Coolify (Runtime only):
#   SESSION_SECRET  = <run: openssl rand -hex 32>
#   OPENAI_API_KEY  = sk-...
#
# All other variables have safe defaults and do NOT need to be set.
# SERVICE_FQDN_APP is auto-managed by Coolify — do not touch it.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Falls back to internal db service if DATABASE_URL is not set in Coolify
      DATABASE_URL: ${DATABASE_URL:-postgresql://chatbot:chatbot@db:5432/chatbot}
      SESSION_SECRET: ${SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: production
      PORT: 5000
    command: sh -c "npm run db:push && node dist/index.cjs"

volumes:
  pgdata:
